<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moto Guesser</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1 class="titulo">Moto Guesser</h1>
    <div class="controles">
        <input type="text" placeholder="Dê seu palpite" id="inputMoto" list="sugestoes">
        <button id="btnPalpite">Chutar</button>
    </div>
    
    <datalist id="sugestoes"></datalist>

    
  <div class="painelJogo">

    <div class="cabecalho-tentativa">
        <div>Modelo</div>
        <div>Marca</div>
        <div>Estilo</div>
        <div>Cilindrada</div>
        <div>Cilindros</div>
        <div>Peso</div>
    </div>

    <div id="containerTentativas">
        </div>

</div>
    <script src="app.js"></script>
</body>

</html>
